name: trades-report
# Read-only: syncs the watched wallet and prints recent trades next to the app's matched signals and the
# price path (needs DATABASE_URL secret). The wallet address is never printed.
on:
  workflow_dispatch:
    inputs:
      n: { description: "How many recent trades", default: "12" }
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv -p 3.12 && uv pip install -e .
      - env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: .venv/bin/python scripts/trades_report.py "${{ github.event.inputs.n }}"
