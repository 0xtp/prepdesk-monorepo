{% extends "base.html" %}
{% block content %}
<form method="post" action="/login" class="mx-auto mt-16 max-w-sm rounded-xl border border-zinc-800 bg-zinc-900/60 p-6 flex flex-col gap-3">
  <h1 class="text-lg font-semibold text-zinc-100">Sign in</h1>
  {% if error %}<p class="text-sm text-rose-400">{{ error }}</p>{% endif %}
  <input type="password" name="password" placeholder="Password" autofocus class="rounded-lg bg-zinc-950 border-zinc-700 text-sm">
  <button class="rounded-lg bg-indigo-500 hover:bg-indigo-400 text-white py-2 text-sm">Sign in</button>
</form>
{% endblock %}
