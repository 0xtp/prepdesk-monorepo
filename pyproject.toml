[project]
name = "perpdesk"
version = "0.1.0"
description = "Crypto perps signal desk: deterministic trade plans with honest tracking"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pandas>=2.2",
  "numpy>=2.0",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "bcrypt>=4.1",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.100",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
  "pandas-stubs",
]

[project.scripts]
perpdesk = "perpdesk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/perpdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "SIM108", "SIM105", "RUF005", "UP046", "UP047", "RUF012", "RUF059"]

[tool.ruff.lint.per-file-ignores]
"src/perpdesk/backtest/main.py" = ["E501"]
"src/perpdesk/db/migrations/*" = ["E501", "W291"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
mypy_path = "src"
packages = ["perpdesk"]

[[tool.mypy.overrides]]
module = ["perpdesk.analysis.*", "perpdesk.plan"]
strict = true

[tool.coverage.run]
source = ["src/perpdesk"]
